<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Payment - A1 Spacial Chicken Biryani</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#fff8f0;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    background:#ffffff;
    padding:30px;
    border-radius:24px;
    border:2px solid #ffe0b2;
    box-shadow:0 15px 35px rgba(0,0,0,.18);
}

h1{
    color:#8B0000;
}

input{
    width:90%;
    padding:16px;
    margin-top:20px;
    font-size:18px;
    border:2px solid #ffd180;
    border-radius:16px;
    background:#fffaf5;
    outline:none;
    transition:.2s;
    box-shadow:0 4px 12px rgba(255,152,0,.08);
}

input:focus{
    border-color:#ff9800;
    box-shadow:0 0 0 4px rgba(255,152,0,.15);
}
select{
width:90%;
padding:16px;
margin-top:20px;
font-size:18px;
border:2px solid #ffd180;
border-radius:16px;
background:#fffaf5;
outline:none;
box-shadow:0 4px 12px rgba(255,152,0,.08);
transition:.2s;
cursor:pointer;
}

select:focus{
border-color:#ff9800;
box-shadow:0 0 0 4px rgba(255,152,0,.15);
}
.btn{
display:block;
width:100%;
margin-top:25px;
background:linear-gradient(135deg,#ff9800,#ff5722);
color:#fff;
text-decoration:none;
padding:20px;
border:none;
border-radius:20px;
font-size:28px;
font-weight:bold;
letter-spacing:0.5px;
cursor:pointer;
box-shadow:0 12px 30px rgba(255,87,34,.35);
transition:all .3s ease;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 18px 40px rgba(255,87,34,.45);
}

.btn:active{
transform:scale(.97);
box-shadow:0 6px 15px rgba(255,87,34,.25);
}

.note{
    margin-top:20px;
    color:#555;
}
</style>

</head>
<body>

<div class="container">

<h1>🍗 A1 Spacial Chicken Biryani</h1>
    <div style="
background:#fff7f0;
border:2px solid #ffe0b2;
border-radius:18px;
padding:16px;
margin:20px 0;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 6px 15px rgba(0,0,0,.08);
">

<div style="display:flex;align-items:center;">
<div style="
width:50px;
height:50px;
border-radius:50%;
background:#ff9800;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
margin-right:12px;">
🔒
</div>

<div style="text-align:left;">
<div style="font-size:20px;font-weight:bold;color:#222;">
Secure Payment
</div>
<div style="font-size:14px;color:#666;">
Pay safely using Razorpay
</div>
</div>
</div>

<div style="
background:#00c853;
color:#fff;
padding:8px 12px;
border-radius:14px;
font-size:13px;
font-weight:bold;">
100% Secure
</div>

    </div>

<h2 style="color:#8B0000;margin-top:25px;margin-bottom:10px;">
🔒 Secure Checkout
</h2>

<p style="
color:#666;
font-size:17px;
margin-top:0;
margin-bottom:25px;
line-height:1.5;">
Complete your order safely in just a few seconds.
</p>

<p>Please enter your mobile number before payment.</p>
<input
  type="text"
  id="name"
  placeholder="Enter Your Name"
  maxlength="40"
  style="width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid #ccc;">
<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number"
maxlength="10">
 
    <h3>Select Payment Amount</h3>

<select id="amount">
  <option value="50">₹50</option>
  <option value="100">₹100</option>
  <option value="150">₹150</option>
  <option value="200">₹200</option>
  <option value="250">₹250</option>
  <option value="300">₹300</option>
  <option value="350">₹350</option>
  <option value="400">₹400</option>
  <option value="custom">Other Amount</option>
</select>

<input
type="number"
id="customAmount"
placeholder="Enter Custom Amount"
style="display:none;"
>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const amount = document.getElementById("amount");
  const custom = document.getElementById("customAmount");

  amount.onchange = function () {
    custom.style.display =
      amount.value === "custom" ? "block" : "none";
  };
});
</script>
<button class="btn" onclick="payNow()">
💳 Pay Now
</button>


<p class="note">

Secure Payment using Razorpay

</p>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_3VjVywMjNAtf9o89sED9tod07dLwDss",
  authDomain: "a1-spacial-chicken-biryani.firebaseapp.com",
  projectId: "a1-spacial-chicken-biryani",
  storageBucket: "a1-spacial-chicken-biryani.firebasestorage.app",
  messagingSenderId: "28701793250",
  appId: "1:28701793250:web:3c5b24a625cd43d09237bb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
    let activeDrawId = "";

window.payNow = async function () {
    alert("PAY NOW FUNCTION STARTED");

    const currentDrawSnap = await getDoc(doc(db, "settings", "currentDraw"));

    if (currentDrawSnap.exists()) {
        activeDrawId = currentDrawSnap.data().activeDrawId;
    }

    const btn = document.querySelector(".btn");
    btn.disabled = true;
    btn.innerHTML = "⌛ Processing Payment...";
btn.style.opacity = "0.8";

const selected = document.getElementById("amount").value;

const amount = selected === "custom"
    ? document.getElementById("customAmount").value
    : selected;
const name = document.getElementById("name").value.trim();
const mobile = document.getElementById("mobile").value.trim();

if (mobile.length != 10) {
    alert("Please enter a valid 10 digit mobile number");
    btn.disabled = false;
btn.innerHTML = "💳 Pay Now";
btn.style.opacity = "1";
    return;
}
if (!amount || Number(amount) <= 0) {
    alert("Please select or enter a valid amount");
    btn.disabled = false;
btn.innerHTML = "💳 Pay Now";
btn.style.opacity = "1";
    return;
}


const settingsRef = doc(db, "settings", "offers");
const offerSnap = await getDoc(settingsRef);

let discountPercent = 0;
let offerName = "";

if (offerSnap.exists()) {
    const offers = offerSnap.data();

    if (offers.festivalOffer) {
        offerName = "Festival Offer";
discountPercent =
    Number(offers.festivalDiscount || 0);

    } else if (offers.sundayOffer) {
        offerName = "Sunday Offer";

discountPercent =
    Number(offers.sundayDiscount || 0);
}

const originalAmount = Number(amount);
const discountAmount = originalAmount * discountPercent / 100;
const finalAmount = originalAmount - discountAmount;

alert(
    "🎉 " + offerName +
    "\n\nOriginal Amount: ₹" + originalAmount +
    "\nDiscount: " + discountPercent + "%" +
    "\nDiscount Amount: ₹" + discountAmount +
    "\n\n💰 Final Amount: ₹" + finalAmount
);
await addDoc(collection(db, "customers"), {
    name: name,
    mobile: mobile,
    amount: Number(amount),
    time: new Date().toLocaleString()
});
    const entryCount = Math.floor(Number(amount) / 100);

for (let i = 0; i < entryCount; i++) {
  await addDoc(collection(db, "luckyDrawEntries"), {
      drawId: activeDrawId,
    name: name,
    mobile: mobile,
    amount: Number(amount),
    paymentTime: new Date().toISOString(),
    isValid: true,
    couponNo: i + 1,
    totalCoupons: entryCount
  });
}
btn.innerHTML = "✅ Redirecting...";

const razorpayPage =
  "https://pages.razorpay.com/pl_TO0jY6tL7fixzX/view?amount=" +
  Math.round(finalAmount) +
  "&phone=" + encodeURIComponent(mobile) +
  "&email=" + encodeURIComponent("ns851245@gmail.com");

window.location.href = razorpayPage;

if (offerSnap.exists() && offerSnap.data().luckyDraw) {
alert(
`🎉 Congratulations ${name}!

✅ Your Lucky Draw Entry has been Registered.

🍀 Best of Luck!

Winner announcement will be made on our WhatsApp Channel.`
);
}


};
</script>
</body>
</html>
