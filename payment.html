<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Payment - A1 Spacial Chicken Biryani</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#fff8f0;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    background:#ffffff;
    padding:30px;
    border-radius:24px;
    border:2px solid #ffe0b2;
    box-shadow:0 15px 35px rgba(0,0,0,.18);
}

h1{
    color:#8B0000;
}

input{
    width:90%;
    padding:14px;
    margin-top:20px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:8px;
}

.btn{
    display:block;
    margin-top:20px;
    background:#8B0000;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:8px;
    font-size:20px;
    font-weight:bold;
}

.note{
    margin-top:20px;
    color:#555;
}
</style>

</head>
<body>

<div class="container">

<h1>🍗 A1 Spacial Chicken Biryani</h1>

<h2>Online Payment</h2>

<p>Please enter your mobile number before payment.</p>

<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number"
maxlength="10">i
    <h3>Select Payment Amount</h3>

<select id="amount">
  <option value="50">₹50</option>
  <option value="100">₹100</option>
  <option value="150">₹150</option>
  <option value="200">₹200</option>
  <option value="250">₹250</option>
  <option value="300">₹300</option>
  <option value="350">₹350</option>
  <option value="400">₹400</option>
  <option value="custom">Other Amount</option>
</select>

<input
type="number"
id="customAmount"
placeholder="Enter Custom Amount"
style="display:none;"
>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const amount = document.getElementById("amount");
  const custom = document.getElementById("customAmount");

  amount.onchange = function () {
    custom.style.display =
      amount.value === "custom" ? "block" : "none";
  };
});
</script>
<button class="btn" onclick="payNow()">
💳 Pay Now
</button>


<p class="note">

Secure Payment using Razorpay

</p>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_3VjVywMjNAtf9o89sED9tod07dLwDss",
  authDomain: "a1-spacial-chicken-biryani.firebaseapp.com",
  projectId: "a1-spacial-chicken-biryani",
  storageBucket: "a1-spacial-chicken-biryani.firebasestorage.app",
  messagingSenderId: "28701793250",
  appId: "1:28701793250:web:3c5b24a625cd43d09237bb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.payNow = async function () {

const selected = document.getElementById("amount").value;

const amount = selected === "custom"
    ? document.getElementById("customAmount").value
    : selected;

const mobile = document.getElementById("mobile").value.trim();

if (mobile.length != 10) {
    alert("Please enter a valid 10 digit mobile number");
    return;
}

if (!amount || Number(amount) <= 0) {
    alert("Please select or enter a valid amount");
    return;
}

await addDoc(collection(db, "customers"), {
    mobile: mobile,
    amount: Number(amount),
    time: new Date().toLocaleString()
});

window.location.href = "https://razorpay.me/@niyajmohammednilgerampa1spaci";

};
</script>
</body>
</html>
