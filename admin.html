<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>A1 Admin Panel</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
margin:0;
}

h1{
text-align:center;
color:#d35400;
}

button{
background:#d35400;
color:white;
border:none;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
margin:4px;
}

button:hover{
opacity:0.9;
}

.searchBox{
padding:10px;
width:280px;
max-width:100%;
font-size:16px;
margin-top:15px;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#ff9800;
color:white;
}

.offerBox{
margin:20px 0;
padding:15px;
background:#fff;
border-radius:8px;
box-shadow:0 0 5px rgba(0,0,0,.15);
}

.offerTitle{
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

.total{
color:green;
}
</style>

</head>

<body>

<h1>A1 Spacial Chicken Biryani</h1>

<button onclick="loadData()">Load Customers</button>
<button onclick="loadLuckyDraw()">🏆 Lucky Draw Entries</button>
  <button onclick="pickWinner()">
🏆 Pick Winner
  </button>
  <button onclick="startNewDraw()">
🆕 Start New Draw
  </button>
<br><br>

<input
type="text"
id="search"
class="searchBox"
placeholder="🔍 Search Mobile Number"
onkeyup="searchMobile()"
>

<h2 class="total">
💰 Total Collection:
₹<span id="total">0</span>
</h2>

<hr>

<div class="offerBox">

<div class="offerTitle">
⚙️ Offer Settings
</div>

<button id="cashbackBtn">
💸 Cashback : OFF 🔴
</button>

<button id="luckyBtn">
🎁 Lucky Draw : OFF 🔴
</button>

<button id="sundayBtn">
☀️ Sunday Offer : OFF 🔴
</button>
<label>
    👥 WhatsApp Group Member Discount (%)
    <input type="number" id="sundayMemberDiscount" min="0" max="100" value="0">
</label>

<label>
    👤 Non-Member Discount (%)
    <input type="number" id="sundayNonMemberDiscount" min="0" max="100" value="0">
</label>
<button id="festivalBtn">
🎉 Festival Offer : OFF 🔴
</button>
<label>
    👥 WhatsApp Group Member Discount (%)
    <input type="number" id="festivalMemberDiscount" min="0" max="100" value="0">
</label>

<label>
    👤 Non-Member Discount (%)
    <input type="number" id="festivalNonMemberDiscount" min="0" max="100" value="0">
</label>
</div>

<hr>

<table>

<thead>

<tr>
<th>Name</th>
<th>Mobile Number</th>
<th>Amount (₹)</th>
<th>Date</th>

</tr>

</thead>

<tbody id="data">

</tbody>

</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc,
  setDoc,
  addDoc,
  query,
  where
  
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_3VjVywMjNAtf9o89sED9tod07dLwDss",
  authDomain: "a1-spacial-chicken-biryani.firebaseapp.com",
  projectId: "a1-spacial-chicken-biryani",
  storageBucket: "a1-spacial-chicken-biryani.firebasestorage.app",
  messagingSenderId: "28701793250",
  appId: "1:28701793250:web:3c5b24a625cd43d09237bb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
  let activeDrawId = "";
let activeDrawName = "";

async function loadActiveDraw() {

  const snap = await getDocs(
    query(
      collection(db, "luckyDraws"),
      where("status", "==", "active")
    )
  );

  if (snap.empty) {

    const newDraw = await addDoc(collection(db, "luckyDraws"), {
      name: "Draw #1",
      status: "active",
      createdAt: new Date().toISOString()
    });

    activeDrawId = newDraw.id;
    activeDrawName = "Draw #1";

  } else {

    const draw = snap.docs[0];

    activeDrawId = draw.id;
    activeDrawName = draw.data().name;

  }

}
  const settingsRef = doc(db, "settings", "offers");
let cashback = false;
let luckyDraw = false;
  let sundayOffer = false;
let festivalOffer = false;
  let sundayMemberDiscount = 0;
let sundayNonMemberDiscount = 0;
let festivalMemberDiscount = 0;
let festivalNonMemberDiscount = 0;
document.addEventListener("DOMContentLoaded", async () => {
 try {
    await loadActiveDraw();
} catch (e) {
    console.error("loadActiveDraw error:", e);
 }
const cashbackBtn = document.getElementById("cashbackBtn");
 
  const luckyBtn = document.getElementById("luckyBtn");
  
  const sundayBtn = document.getElementById("sundayBtn");
  
const festivalBtn = document.getElementById("festivalBtn");
  const sundayMemberDiscountInput = document.getElementById("sundayMemberDiscount");
const sundayNonMemberDiscountInput = document.getElementById("sundayNonMemberDiscount");
const festivalMemberDiscountInput = document.getElementById("festivalMemberDiscount");
const festivalNonMemberDiscountInput = document.getElementById("festivalNonMemberDiscount");
  const snap = await getDoc(settingsRef);

if (snap.exists()) {

cashback = snap.data().cashback;

 luckyDraw = snap.data().luckyDraw || false;

  sundayOffer = snap.data().sundayOffer || false;
  
festivalOffer = snap.data().festivalOffer || false;
  sundayMemberDiscount = snap.data().sundayMemberDiscount ?? 0;
sundayNonMemberDiscount = snap.data().sundayNonMemberDiscount ?? 0;
festivalMemberDiscount = snap.data().festivalMemberDiscount ?? 0;
festivalNonMemberDiscount = snap.data().festivalNonMemberDiscount ?? 0;

document.getElementById("sundayMemberDiscount").value = sundayMemberDiscount;
document.getElementById("sundayNonMemberDiscount").value = sundayNonMemberDiscount;
document.getElementById("festivalMemberDiscount").value = festivalMemberDiscount;
document.getElementById("festivalNonMemberDiscount").value = festivalNonMemberDiscount;
  if (luckyDraw) {
    luckyBtn.innerHTML = "🎁 Lucky Draw : ON 🟢";
} else {
    luckyBtn.innerHTML = "🎁 Lucky Draw : OFF 🔴";
  }
if (cashback) {
cashbackBtn.innerHTML = "💸 Cashback : ON 🟢";
} else {
cashbackBtn.innerHTML = "💸 Cashback : OFF 🔴";
}

}
if (sundayOffer) {
    sundayBtn.innerHTML = "☀️ Sunday Offer : ON 🟢";
} else {
    sundayBtn.innerHTML = "☀️ Sunday Offer : OFF 🔴";
}

if (festivalOffer) {
    festivalBtn.innerHTML = "🎉 Festival Offer : ON 🟢";
} else {
    festivalBtn.innerHTML = "🎉 Festival Offer : OFF 🔴";
}

cashbackBtn.onclick = async function(){

cashback = !cashback;

if(cashback){

cashbackBtn.innerHTML = "💸 Cashback : ON 🟢";

}else{

cashbackBtn.innerHTML = "💸 Cashback : OFF 🔴";

}
try {
    await setDoc(settingsRef, {
    cashback: cashback
}, { merge: true });
    alert("Saved");
} catch (e) {
    alert(e.message);
}
};

  luckyBtn.onclick = async function () {

    luckyDraw = !luckyDraw;

    if (luckyDraw) {
        luckyBtn.innerHTML = "🎁 Lucky Draw : ON 🟢";
    } else {
        luckyBtn.innerHTML = "🎁 Lucky Draw : OFF 🔴";
    }

    try {
        await setDoc(settingsRef, {
            luckyDraw: luckyDraw
        }, { merge: true });

        alert("Saved");
    } catch (e) {
        alert(e.message);
    }
};
  sundayBtn.onclick = async function () {

    sundayOffer = !sundayOffer;

    if (sundayOffer) {
        sundayBtn.innerHTML = "☀️ Sunday Offer : ON 🟢";
    } else {
        sundayBtn.innerHTML = "☀️ Sunday Offer : OFF 🔴";
    }

    try {
        await setDoc(settingsRef, {
    sundayOffer: sundayOffer,
    sundayMemberDiscount: Number(document.getElementById("sundayMemberDiscount").value),
sundayNonMemberDiscount: Number(document.getElementById("sundayNonMemberDiscount").value)
}, { merge: true });

        alert("Saved");
    } catch (e) {
        alert(e.message);
    }
};
  festivalBtn.onclick = async function () {

    festivalOffer = !festivalOffer;

    if (festivalOffer) {
        festivalBtn.innerHTML = "🎉 Festival Offer : ON 🟢";
    } else {
        festivalBtn.innerHTML = "🎉 Festival Offer : OFF 🔴";
    }

    try {
        await setDoc(settingsRef, {
    festivalOffer: festivalOffer,
    festivalMemberDiscount: Number(document.getElementById("festivalMemberDiscount").value)
festivalNonMemberDiscount: Number(document.getElementById("festivalNonMemberDiscount").value)
}, { merge: true });

        alert("Saved");
    } catch (e) {
        alert(e.message);
    }
};
  });
  window.searchMobile = function () {

let input = document.getElementById("search").value.toUpperCase();

let table = document.getElementById("data");
let tr = table.getElementsByTagName("tr");

for (let i = 0; i < tr.length; i++) {

let td = tr[i].getElementsByTagName("td")[0];

if (td) {

let txt = td.textContent || td.innerText;

if (txt.toUpperCase().indexOf(input) > -1) {
tr[i].style.display = "";
} else {
tr[i].style.display = "none";
}

}

}

  }
window.loadData = async function () {

  const table = document.getElementById("data");
  table.innerHTML = "";
let total = 0;
  const querySnapshot = await getDocs(collection(db, "customers"));

  querySnapshot.forEach((doc) => {
    const d = doc.data();
total += Number(d.amount || 0);
  table.innerHTML += `
<tr>
<td>${d.name || d.Name || "-"}</td>
<td>${d.mobile || d.Mobile}</td>
<td>₹${d.amount || 0}</td>
<td>${d.time || "-"}</td>
</tr>
`;
  });
document.getElementById("total").innerText = total;
};
  window.loadLuckyDraw = async function () {

  const table = document.getElementById("data");
  table.innerHTML = "";
  let total = 0;

  const querySnapshot = await getDocs(
    query(
        collection(db, "luckyDrawEntries"),
        where("drawId", "==", activeDrawId)
    )
);

  querySnapshot.forEach((doc) => {
    const d = doc.data();

    total += Number(d.amount || 0);

    table.innerHTML += `
      <tr>
        <td>${d.name || "-"}</td>
        <td>${d.mobile || "-"}</td>
        <td>₹${d.amount}</td>
        <td>${d.paymentTime || "-"}</td>
      </tr>
    `;
  });

  document.getElementById("total").innerText = total;

};
  window.pickWinner = async function () {

  const querySnapshot = await getDocs(
    query(
        collection(db, "luckyDrawEntries"),
        where("drawId", "==", activeDrawId)
    )
);

const winnerSnapshot = await getDocs(
    query(
        collection(db, "luckyDrawWinners"),
        where("drawId", "==", activeDrawId)
    )
);

const previousWinnerMobiles = new Set();

winnerSnapshot.forEach((doc) => {
    const winner = doc.data();

    if (winner.mobile) {
        previousWinnerMobiles.add(String(winner.mobile));
    }
});

let entries = [];

querySnapshot.forEach((doc) => {
    const entry = doc.data();

    if (!previousWinnerMobiles.has(String(entry.mobile))) {
        entries.push(entry);
    }
});

  if (entries.length === 0) {
    alert("No Lucky Draw Entries Found!");
    return;
  }

  const randomIndex = Math.floor(Math.random() * entries.length);
    const winnerNumber = winnerSnapshot.size + 1;

  const winner = entries[randomIndex];
    await addDoc(collection(db, "luckyDrawWinners"), {
  name: winner.name,
  mobile: winner.mobile,
  amount: winner.amount,
  paymentTime: winner.paymentTime || "",
  winnerNumber: winnerNumber,
winnerPosition:
    winnerNumber === 1 ? "1st Winner" :
    winnerNumber === 2 ? "2nd Winner" :
    winnerNumber === 3 ? "3rd Winner" :
    winnerNumber + "th Winner",
drawId: activeDrawId,
  winnerTime: new Date().toISOString()
});
    alert(
  "🏆 Winner\n\n" +
  "Name: " + winner.name +
  "\n\nMobile: " + winner.mobile +
  "\n\nAmount: ₹" + winner.amount
);
    };
  window.startNewDraw = async function () {
    alert("Start New Draw Clicked");

  if (!confirm("Start a New Lucky Draw?")) return;
    alert("After Confirm");
    alert("activeDrawId = " + activeDrawId);

  await updateDoc(doc(db, "luckyDraws", activeDrawId), {
    status: "completed"
  });

  const snap = await getDocs(collection(db, "luckyDraws"));
  const drawNumber = snap.size + 1;

  const newDraw = await addDoc(collection(db, "luckyDraws"), {
    name: "Draw #" + drawNumber,
    status: "active",
    createdAt: new Date().toISOString()
  });

  activeDrawId = newDraw.id;
  activeDrawName = "Draw #" + drawNumber;
    await setDoc(doc(db, "settings", "currentDraw"), {
  activeDrawId: activeDrawId,
  activeDrawName: activeDrawName
});

  alert("✅ " + activeDrawName + " Started Successfully!");
  }
</script>

</body>
</html>
