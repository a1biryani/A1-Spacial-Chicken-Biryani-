<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>A1 Admin Panel</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
margin:0;
}

h1{
text-align:center;
color:#d35400;
}

button{
background:#d35400;
color:white;
border:none;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
margin:4px;
}

button:hover{
opacity:0.9;
}

.searchBox{
padding:10px;
width:280px;
max-width:100%;
font-size:16px;
margin-top:15px;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#ff9800;
color:white;
}

.offerBox{
margin:20px 0;
padding:15px;
background:#fff;
border-radius:8px;
box-shadow:0 0 5px rgba(0,0,0,.15);
}

.offerTitle{
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

.total{
color:green;
}
</style>

</head>

<body>

<h1>A1 Spacial Chicken Biryani</h1>

<button onclick="loadData()">Load Customers</button>

<br><br>

<input
type="text"
id="search"
class="searchBox"
placeholder="🔍 Search Mobile Number"
onkeyup="searchMobile()"
>

<h2 class="total">
💰 Total Collection:
₹<span id="total">0</span>
</h2>

<hr>

<div class="offerBox">

<div class="offerTitle">
⚙️ Offer Settings
</div>

<button id="cashbackBtn">
💸 Cashback : OFF 🔴
</button>

<button id="luckyBtn">
🎁 Lucky Draw : OFF 🔴
</button>

<button id="sundayBtn">
☀️ Sunday Offer : OFF 🔴
</button>

<button id="festivalBtn">
🎉 Festival Offer : OFF 🔴
</button>

</div>

<hr>

<table>

<thead>

<tr>

<th>Mobile Number</th>
<th>Amount (₹)</th>
<th>Date</th>

</tr>

</thead>

<tbody id="data">

</tbody>

</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc,
  setDoc
  
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_3VjVywMjNAtf9o89sED9tod07dLwDss",
  authDomain: "a1-spacial-chicken-biryani.firebaseapp.com",
  projectId: "a1-spacial-chicken-biryani",
  storageBucket: "a1-spacial-chicken-biryani.firebasestorage.app",
  messagingSenderId: "28701793250",
  appId: "1:28701793250:web:3c5b24a625cd43d09237bb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
  const settingsRef = doc(db, "settings", "offers");
let cashback = false;

document.addEventListener("DOMContentLoaded", async () => {
  
const cashbackBtn = document.getElementById("cashbackBtn");
  const snap = await getDoc(settingsRef);

if (snap.exists()) {

cashback = snap.data().cashback;

if (cashback) {
cashbackBtn.innerHTML = "💸 Cashback : ON 🟢";
} else {
cashbackBtn.innerHTML = "💸 Cashback : OFF 🔴";
}

}


cashbackBtn.onclick = async function(){

cashback = !cashback;

if(cashback){

cashbackBtn.innerHTML = "💸 Cashback : ON 🟢";

}else{

cashbackBtn.innerHTML = "💸 Cashback : OFF 🔴";

}
try {
    await setDoc(settingsRef, {
    cashback: cashback
}, { merge: true });
    alert("Saved");
} catch (e) {
    alert(e.message);
}
};

});
  window.searchMobile = function () {

let input = document.getElementById("search").value.toUpperCase();

let table = document.getElementById("data");
let tr = table.getElementsByTagName("tr");

for (let i = 0; i < tr.length; i++) {

let td = tr[i].getElementsByTagName("td")[0];

if (td) {

let txt = td.textContent || td.innerText;

if (txt.toUpperCase().indexOf(input) > -1) {
tr[i].style.display = "";
} else {
tr[i].style.display = "none";
}

}

}

  }
window.loadData = async function () {

  const table = document.getElementById("data");
  table.innerHTML = "";
let total = 0;
  const querySnapshot = await getDocs(collection(db, "customers"));

  querySnapshot.forEach((doc) => {
    const d = doc.data();
total += Number(d.amount || 0);
  table.innerHTML += `
<tr>
  <td>${d.mobile || d.Mobile}</td>
  <td>₹${d.amount || 0}</td>
  <td>${d.time || "-"}</td>
</tr>
`;
  });
document.getElementById("total").innerText = total;
};
</script>

</body>
</html>
